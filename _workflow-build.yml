name: build

# The build farm. GitHub-hosted runners already have the Android SDK,
# unrestricted access to Google's Maven, and KVM — so the emulator job below is
# the only place in this project where instrumented tests can actually run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core — verified logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      # Git on Windows does not preserve the Unix executable bit, so gradlew
      # arrives here as a plain file and `./gradlew` fails with exit code 126.
      # Setting it in the workflow keeps this working no matter what the file
      # mode is in the repository.
      - run: chmod +x ./gradlew
      - name: Run the core verification suite
        run: ./gradlew :core:test --no-daemon
      - name: Publish the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/

  assemble:
    name: app — assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-key-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  instrumented:
    name: app — on an emulator
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # Launches the app and dumps logcat, so a crash on startup shows up
          # in CI rather than only on a device in someone's hand.
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon || true
            adb logcat -b crash -d > crash.txt || true
            adb logcat -d -s AndroidRuntime:E > runtime-errors.txt || true
            echo "----- crash buffer -----"; cat crash.txt
            echo "----- AndroidRuntime errors -----"; cat runtime-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-logs
          path: |
            crash.txt
            runtime-errors.txt
