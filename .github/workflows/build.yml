name: build

# The build farm. GitHub-hosted runners have the Android SDK, unrestricted
# access to Google's Maven, and KVM — so this is the only place in the project
# where the app can actually be run rather than merely compiled.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core — verified logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      # Windows checkouts do not carry the Unix exec bit, so gradlew can arrive
      # as a plain file — that is the "exit code 126" the first runs died with.
      - run: chmod +x ./gradlew
      - name: Run the core verification suite
        run: ./gradlew :core:test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/

  assemble:
    name: app — assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-key-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  smoke:
    name: app — launch it and watch
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # All the logic lives in ci/smoke.sh so it can be changed without editing
      # this file. Instrumented tests drive composables in their own host
      # activity and never touch MainActivity, so they cannot reproduce a
      # startup crash — that is why the script launches the real activity.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash ci/smoke.sh

      - name: Publish the launch report
        if: always()
        run: |
          echo '## App launch' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat launch-report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo 'no report produced — the emulator step never ran' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch
          path: |
            launch-report.txt
            launch.png
          if-no-files-found: ignore
