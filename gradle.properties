# ---------------------------------------------------------------- JVM memory
# Gradle's own daemon. Kept modest so it coexists with Android Studio and the
# separate Kotlin compile daemon rather than starving them.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# ---------------------------------------------------------------- Kotlin daemon
# Kotlin compiles in its OWN JVM, launched by Gradle and reached over a local
# socket. Without an explicit heap it inherits defaults that are often too small
# on Windows, and the process dies during handshake — which surfaces as the
# unhelpful "Could not connect to Kotlin compile daemon".
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# If the daemon cannot be reached, compile in-process instead of failing the
# build outright. Default is true; set here so it is not silently flipped.
kotlin.daemon.useFallbackStrategy=true

# LAST RESORT — uncomment to skip the daemon entirely and compile inside the
# Gradle process. Use this if the daemon keeps failing to connect, which on
# Windows is usually antivirus or a firewall blocking the loopback socket the
# daemon needs. Costs incremental-build speed; if you enable it, raise
# org.gradle.jvmargs above to -Xmx4g.
#kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------- Android
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
